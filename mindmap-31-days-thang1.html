<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Story A Day – Mind Map</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf2;--ink:#2b1a10;--soft:#6d594b;--line:#e6d8c6;--box:#fff;--hi:#c2410c;--hi2:#15803d;--btn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1712;--ink:#f6ece0;--soft:#c9b6a5;--line:#3f322a;--box:#2a211b;--hi:#fb923c;--hi2:#a3d65c;--btn:#ea580c}}
:root[data-theme="dark"]{--bg:#1d1712;--ink:#f6ece0;--soft:#c9b6a5;--line:#3f322a;--box:#2a211b;--hi:#fb923c;--hi2:#a3d65c;--btn:#ea580c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Montserrat,Arial,sans-serif}
main{max-width:840px;margin:0 auto;padding:18px 12px 40px}
h1{font:800 clamp(20px,4.4vw,28px)/1.25 Montserrat,Arial,sans-serif;text-align:center;margin:6px 0 4px}
.sub{text-align:center;color:var(--soft);font-size:13px;margin:0 0 12px}
.nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.nav a{width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;background:var(--box);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700}
.nav a.on{background:var(--btn);border-color:var(--btn);color:#fff}
.box{border:1px solid var(--line);background:var(--box);border-radius:16px;padding:14px 16px;margin:16px 0 0}
.box h2{font:800 17px Montserrat,Arial,sans-serif;margin:0 0 8px}
.box p{margin:0;line-height:1.85;font-size:16px}
.box b{color:var(--hi)}
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.audio select,.audio button{font:600 13px Montserrat,Arial,sans-serif;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px}
.audio select{max-width:100%;flex:1 1 200px}
.audio button{background:var(--btn);border-color:var(--btn);color:#fff;cursor:pointer}
.audio button.alt{background:var(--bg);color:var(--ink);border-color:var(--line)}
.am{font-size:12.5px;color:var(--soft);margin:4px 0 0!important;line-height:1.4!important}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:700}
td:nth-child(3){color:var(--soft)}
td:nth-child(3) b{color:var(--hi2)}
footer{text-align:center;color:var(--soft);font-size:13px;margin-top:26px}
footer b{color:var(--ink)}
/* ---- mind map ---- */
.map{position:relative;container-type:inline-size;width:100%;aspect-ratio:780/600;margin-top:16px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background-color:var(--mbg)}
.map.grid{background-image:linear-gradient(var(--mg) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--mg) 1.5px,transparent 1.5px);background-size:5% 6.5%}
.map.dots{background-image:radial-gradient(var(--mg) 2.5px,transparent 3px);background-size:3.4% 4.4%}
.map svg.ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.n,.t{position:absolute;left:var(--l);top:var(--t);width:var(--w);height:var(--h);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.n{background:var(--c);color:var(--tx);padding:0 9%}
.n h3{margin:0 0 .7cqw;font:800 2.05cqw/1.15 Montserrat,Arial,sans-serif}
.n p{margin:0;font:700 2.3cqw/1.3 Montserrat,Arial,sans-serif;text-wrap:balance}
.t{color:var(--ct);padding:0 2cqw}
.t small{font:700 1.9cqw/1.2 Montserrat,Arial,sans-serif;opacity:.9}
.t strong{font:800 3.1cqw/1.12 Montserrat,Arial,sans-serif;text-wrap:balance}
.t.long strong{font-size:2.55cqw}
.tt-pill{background:var(--tc);border-radius:5cqw;box-shadow:0 0 0 .5cqw rgba(0,0,0,.18)}
.tt-badge{background:var(--tc);border-radius:50%;box-shadow:0 0 0 .6cqw var(--bd)}
.tt-blob{background:var(--tc);border-radius:48% 52% 44% 56% / 55% 46% 54% 45%}
.tt-plain{color:var(--pt)}
.sh-blob.v0{border-radius:46% 54% 38% 62% / 52% 40% 60% 48%}.sh-blob.v1{border-radius:60% 40% 55% 45% / 42% 58% 42% 58%}.sh-blob.v2{border-radius:40% 60% 66% 34% / 58% 46% 54% 42%}.sh-blob.v3{border-radius:52% 48% 40% 60% / 38% 62% 38% 62%}.sh-blob.v4{border-radius:36% 64% 52% 48% / 50% 36% 64% 50%}.sh-blob.v5{border-radius:58% 42% 44% 56% / 62% 48% 52% 38%}
.sh-wobble{padding:0 6%}
.sh-wobble.v0{border-radius:16% 24% 12% 28% / 26% 14% 28% 16%}.sh-wobble.v1{border-radius:26% 12% 24% 14% / 14% 28% 16% 26%}.sh-wobble.v2{border-radius:12% 28% 18% 24% / 22% 18% 30% 14%}.sh-wobble.v3{border-radius:24% 16% 28% 12% / 16% 26% 12% 28%}.sh-wobble.v4{border-radius:18% 26% 14% 22% / 28% 12% 24% 18%}.sh-wobble.v5{border-radius:28% 14% 22% 16% / 14% 24% 18% 30%}
.sh-arch{border-radius:50% 50% 8% 8% / 62% 62% 10% 10%;border:.6cqw solid var(--bd);padding:3% 7% 0}
.sh-hex{clip-path:polygon(24% 0,76% 0,100% 50%,76% 100%,24% 100%,0 50%);padding:0 15%}
.sh-cloud{padding:0 13%}
.sh-cloud::before{content:"";position:absolute;inset:4.5%;background:var(--in);clip-path:inherit;z-index:0}
.sh-cloud>*{position:relative;z-index:1}
.sh-cloud.v0{clip-path:url(#cA)}.sh-cloud.v1{clip-path:url(#cB)}.sh-cloud.v2{clip-path:url(#cC)}.sh-cloud.v3{clip-path:url(#cD)}.sh-cloud.v4{clip-path:url(#cA)}.sh-cloud.v5{clip-path:url(#cB)}
@media (max-width:640px){
.map{aspect-ratio:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background-image:none!important}
.map svg.ar{display:none}
.n,.t{position:static;width:100%;height:auto;clip-path:none!important;border-radius:22px!important;padding:14px 16px!important}
.sh-cloud{background:var(--in);border:5px solid var(--c);color:var(--tx)}
.sh-cloud::before{display:none}
.n h3{font-size:15px}.n p{font-size:18px}
.t strong,.t.long strong{font-size:26px}.t small{font-size:13px}
.tt-badge{box-shadow:none}
}
</style>
</head>

const PAL=[
{n:["#e8955f","#e9bd45","#d79a66","#c9cf5a","#e37d63","#e0a94f"],bg:"#f6ecdc",g:"#e8d9bd",c:"#6b4533",ct:"#fff",ar:"#5a3a28",bd:"#6b4533",in:"#fffaf0",pt:"#5a3a28"},
{n:["#ff8a1f","#8a3fe0","#ee5fcb","#3b4fd8","#1fa653","#ffd23f"],bg:"#fff1d6",g:"#efc990",c:"#3b4fd8",ct:"#fff",ar:"#222",bd:"#222",in:"#fff",pt:"#3b4fd8"},
{n:["#8c1d2f","#a3243a","#7a1a2c","#8c1d2f","#a3243a","#7a1a2c"],bg:"#fff0cf",g:"#f2d78a",c:"#fff3d6",ct:"#8c1d2f",ar:"#1f8a70",bd:"#f2b632",in:"#fff3d6",pt:"#8c1d2f"},
{n:["#f0508a","#f472b6","#ec4899","#f0508a","#f472b6","#ec4899"],bg:"#ffe3c4",g:"#f7c9a0",c:"#fff",ct:"#7a1f3a",ar:"#8a3b45",bd:"#f0508a",in:"#fff",pt:"#7a1f3a"},
{n:["#2f80ed","#00a9a5","#7b61ff","#ff7a59","#f2b632","#27ae60"],bg:"#e8f4ff",g:"#bcdcf7",c:"#0b3d91",ct:"#fff",ar:"#0b3d91",bd:"#0b3d91",in:"#fff",pt:"#0b3d91"},
{n:["#e6d3c7","#d9e6c6","#f3d9c0","#cfe3d4","#e6d3c7","#d9e6c6"],bg:"#ffffff",g:"#e9efe2",c:"#9db987",ct:"#2b3a25",ar:"#7da36a",bd:"#9db987",in:"#fff",pt:"#4d6b3f"},
{n:["#ff6b9d","#ffa94d","#51cf66","#4dabf7","#b197fc","#ffd43b"],bg:"#fff5f9",g:"#ffd3e4",c:"#ae3ec9",ct:"#fff",ar:"#862e9c",bd:"#862e9c",in:"#fff",pt:"#862e9c"}
];
const SH=["cloud","blob","arch","wobble"],TT=["pill","badge","blob","plain"],BG=["grid","plain","dots"];
const SP={1:{sh:"hex",p:5,t:"blob",bg:"plain",dc:-1},2:{sh:"blob",p:0,t:"blob",bg:"plain",dc:3},3:{sh:"blob",p:1,t:"pill",bg:"grid",dc:0},4:{sh:"arch",p:2,t:"badge",bg:"grid",dc:1},5:{sh:"cloud",p:3,t:"plain",bg:"plain",dc:2}};
const combo=d=>SP[d]||{sh:SH[d%4],p:(d*3)%7,t:TT[(d+1)%4],bg:BG[d%3],dc:(d+1)%4};
const face=(x,y,s)=>`<circle cx="${x+s*.3}" cy="${y+s*.42}" r="${s*.07}" fill="#222"/><circle cx="${x+s*.7}" cy="${y+s*.42}" r="${s*.07}" fill="#222"/><path d="M${x+s*.34} ${y+s*.64}q${s*.16} ${s*.16} ${s*.32} 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`;
const flower=(x,y,c)=>`<g transform="translate(${x} ${y})"><g fill="${c}" stroke="#0003" stroke-width="1.5">`+[[0,-13],[12,-4],[8,11],[-8,11],[-12,-4]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="10"/>`).join("")+`</g><circle r="7" fill="#ffd23f"/></g>`;
const DEC=[
()=>`<g stroke="#222" stroke-width="3" stroke-linejoin="round"><rect x="10" y="10" width="48" height="48" rx="5" fill="#3cb857"/><path d="M722 58L746 12L770 58Z" fill="#ff8a1f"/><circle cx="34" cy="566" r="26" fill="#ffd23f"/><path d="M728 590L726 552L748 534L770 552L768 590Z" fill="#a77bf0"/></g>`+face(10,10,48)+face(722,24,48)+face(8,540,52)+face(724,546,44),
()=>`<g fill="none" stroke-width="8" stroke-linecap="round"><path d="M10 64A54 54 0 0 1 64 10" stroke="#d1495b"/><path d="M10 48A38 38 0 0 1 48 10" stroke="#f2b632"/><path d="M10 32A22 22 0 0 1 32 10" stroke="#3a9d6e"/><path d="M770 64A54 54 0 0 0 716 10" stroke="#d1495b"/><path d="M770 48A38 38 0 0 0 732 10" stroke="#f2b632"/><path d="M770 32A22 22 0 0 0 748 10" stroke="#3a9d6e"/></g><circle cx="36" cy="564" r="28" fill="#ef5a1f"/><circle cx="744" cy="564" r="28" fill="#ef5a1f"/>`+[[26,558],[46,558],[734,558],[754,558]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff"/><circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#222"/>`).join(""),
()=>flower(34,36,"#a06be0")+flower(746,36,"#ef5a8c")+flower(34,566,"#ef5a8c")+`<g transform="translate(740 560)"><circle r="26" fill="#f08a24" stroke="#222" stroke-width="3"/><path d="M-26 0H26M0 -26V26M-18 -18Q-7 0 -18 18M18 -18Q7 0 18 18" stroke="#222" stroke-width="2.4" fill="none"/></g>`,
()=>`<g fill="#7d9a5f" stroke="#5b7743" stroke-width="2">`+[[16,14,40],[22,40,50],[10,70,60],[764,14,140],[758,40,130],[770,70,120],[16,586,-30],[24,560,-40],[764,586,-150],[756,560,-140]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="6" ry="16" transform="rotate(${p[2]} ${p[0]} ${p[1]})"/>`).join("")+`</g>`
];
const $=s=>document.querySelector(s);
const bold=s=>s.replace(/\{([^}]+)\}/g,"<b>$1</b>");
const plain=s=>s.replace(/[{}]/g,"");
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255};
function slots(k){
 if(k===4)return[[25,23],[75,23],[75,77],[25,77]];
 const rx=k===5?35:36,ry=k===5?36:37,a0=-90,st=360/k,o=[];
 for(let i=0;i<k;i++){const a=(a0+st*i)*Math.PI/180;o.push([50+rx*Math.cos(a),50+ry*Math.sin(a)])}
 return o;
}
function arrow(p,c,i){
 const px=p[0]/100*780,py=p[1]/100*600,cx=390,cy=300,dx=px-cx,dy=py-cy;
 const t0=1/Math.hypot(dx/122,dy/72),u=1/Math.hypot(dx/130,dy/76);
 const sx=cx+dx*t0,sy=cy+dy*t0,ex=px-dx*u,ey=py-dy*u;
 const mx=(sx+ex)/2,my=(sy+ey)/2,L=Math.hypot(ex-sx,ey-sy),nx=-(ey-sy)/L,ny=(ex-sx)/L,s=i%2?1:-1,qx=mx+nx*L*.14*s,qy=my+ny*L*.14*s;
 const an=Math.atan2(ey-qy,ex-qx),h=(d)=>`${ex-16*Math.cos(an+d)} ${ey-16*Math.sin(an+d)}`;
 return `<path class="ln" style="stroke:${c};stroke-width:3.6" d="M${sx} ${sy}Q${qx} ${qy} ${ex} ${ey}M${h(.5)}L${ex} ${ey}L${h(-.5)}"/>`;
}
let N=1,voices=[];
function render(){
 N=Math.min(31,Math.max(1,parseInt((location.hash.match(/^#d(\d+)/)||[])[1])||1));
 if(window.speechSynthesis)speechSynthesis.cancel();setBtn(false);
 const D=DAYS[N-1],cf=combo(N),P=PAL[cf.p];
 $("#ttl").textContent="Day "+N+": "+D.t;document.title="Day "+N+" – "+D.t;
 document.querySelectorAll("#nav a").forEach((a,i)=>a.classList.toggle("on",i==N-1));
 $("#story").innerHTML=D.s.map(b=>bold(b[1])).join(" ");
 $("#rows").innerHTML=D.s.map((b,i)=>`<tr><td>${i+1}</td><td>${bold(b[1])}</td><td>${b[3].split(";").map(x=>{const[a,c]=x.split("→");return`<b>${a}</b> → ${c}`}).join("<br>")}</td></tr>`).join("");
 const m=$("#map"),k=D.s.length,sl=slots(k);
 m.className="map "+(cf.bg==="plain"?"":cf.bg);
 m.style.cssText=`--mbg:${P.bg};--mg:${P.g};--bd:${P.bd};--in:${P.in};--ct:${P.ct};--tc:${P.c};--pt:${P.pt}`;
 let h=`<svg class="ar" viewBox="0 0 780 600" preserveAspectRatio="none" aria-hidden="true">${cf.dc>=0?DEC[cf.dc]():""}${sl.map((s,i)=>arrow(s,P.ar,i)).join("")}</svg>`;
 sl.forEach((s,i)=>{const fill=P.n[i%6],tx=cf.sh==="cloud"?"#3a1f2b":(lum(fill)>.55?"#2b1a10":"#fff");
  h+=`<article class="n sh-${cf.sh} v${i%6}" style="--l:${s[0]-15}%;--t:${s[1]-10.5}%;--w:30%;--h:21%;--c:${fill};--tx:${tx}"><h3>${i+1} · ${D.s[i][0]}</h3><p>${D.s[i][2]}</p></article>`});
 const tt=cf.t==="plain"?"tt-plain":"tt-"+cf.t;
 h+=`<div class="t ${tt}${D.t.length>16?" long":""}" style="--l:36%;--t:40%;--w:28%;--h:20%"><small>Day ${N} · Mind Map</small><strong>${D.t}</strong></div>`;
 m.innerHTML=h;
}
/* audio */
const syn=window.speechSynthesis;
function setBtn(on){$("#play").textContent=on?"↻ Nghe lại":"▶ Nghe";$("#pause").textContent="⏸"}
function loadVoices(){
 if(!syn){$("#am").textContent="Trình duyệt này chưa hỗ trợ đọc giọng nói.";return}
 voices=syn.getVoices().filter(v=>/^en/i.test(v.lang));
 const sel=$("#voice"),cur=sel.value;
 sel.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join(""):"<option value=\"-1\">Chưa có giọng tiếng Anh</option>";
 if(sel.dataset.set&&cur)sel.value=cur;else{const i=voices.findIndex(v=>/en[-_]US/i.test(v.lang));if(i>=0)sel.value=i}
 $("#am").textContent=voices.length?"Chọn giọng (Anh/Mỹ/…) và tốc độ rồi bấm Nghe. Danh sách giọng phụ thuộc thiết bị của em.":"Máy chưa cài giọng tiếng Anh. Thử mở bằng Chrome/Safari hoặc cài thêm giọng trong cài đặt thiết bị.";
}
function speak(){
 if(!syn)return;syn.cancel();
 const parts=plain($("#story").textContent).replace(/([.!?]+[”"]?)\s+/g,"$1|").split("|").filter(Boolean),v=voices[+$("#voice").value];
 parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=v?v.lang:"en-US";if(v)u.voice=v;u.rate=+$("#rate").value;if(i===parts.length-1)u.onend=()=>setBtn(false);syn.speak(u)});
 setBtn(true);
}
$("#play").onclick=speak;
$("#pause").onclick=()=>{if(!syn)return;if(syn.paused){syn.resume();$("#pause").textContent="⏸"}else{syn.pause();$("#pause").textContent="▶"}};
$("#stop").onclick=()=>{if(syn)syn.cancel();setBtn(false)};
$("#voice").onchange=e=>{e.target.dataset.set=1};
if(syn){loadVoices();syn.onvoiceschanged=loadVoices}else loadVoices();
$("#nav").innerHTML=DAYS.map((d,i)=>`<a href="#d${i+1}" title="${d.t}">${i+1}</a>`).join("");
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
render();
</script>
