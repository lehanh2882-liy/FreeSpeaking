<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ luyện nói - FreeSpeaking</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f6f8fa;
            color: #24292f;
        }
        h1 {
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 12px;
            color: #1f2328;
        }
        #file-list {
            list-style: none;
            padding: 0;
        }
        #file-list li {
            margin: 12px 0;
        }
        #file-list a {
            display: block;
            padding: 15px 20px;
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            text-decoration: none;
            color: #0969da;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        #file-list a:hover {
            background-color: #f3f4f6;
            border-color: #0969da;
            transform: translateY(-2px);
        }
        .loading {
            color: #57606a;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>📚 Bộ luyện nói (FreeSpeaking)</h1>
    <ul id="file-list">
        <li class="loading">Đang tải danh sách bài học...</li>
    </ul>

    <script>
        // Thông tin repository lấy từ ảnh của bạn
        const username = 'lehanh2882-liy';
        const repo = 'FreeSpeaking';

        async function loadFiles() {
            const listElement = document.getElementById('file-list');
            try {
                // Gọi API của GitHub để lấy danh sách file trong thư mục gốc
                const response = await fetch(`https://github.com{username}/${repo}/contents/`);
                const files = await response.json();

                listElement.innerHTML = ''; // Xóa chữ "Đang tải..."

                files.forEach(file => {
                    // Chỉ lấy các file có đuôi .html và bỏ qua chính file index.html
                    if (file.name.endsWith('.html') && file.name !== 'index.html') {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        
                        // Trỏ link trực tiếp tới file html
                        a.href = encodeURIComponent(file.name);
                        
                        // Làm đẹp tên hiển thị (xóa .html và thay dấu gạch ngang thành khoảng trắng)
                        let cleanName = file.name.replace('.html', '').replace(/-/g, ' ');
                        a.textContent = '📄 ' + cleanName;
                        
                        li.appendChild(a);
                        listElement.appendChild(li);
                    }
                });

                if (listElement.innerHTML === '') {
                    listElement.innerHTML = '<li>Chưa có bài học nào được tải lên.</li>';
                }
            } catch (error) {
                listElement.innerHTML = '<li>Có lỗi xảy ra khi tải danh sách file. Vui lòng thử lại sau.</li>';
                console.error(error);
            }
        }

        // Chạy hàm ngay khi mở trang
        loadFiles();
    </script>

</body>
</html>
