<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeSpeaking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f9f7;
      color: #1e3a3a;
      padding: 40px 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #64748b; margin-bottom: 24px; }
    .folder-heading {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0f766e;
      margin: 20px 0 10px;
    }
    .file-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .file-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      text-decoration: none;
      color: #1e293b;
      transition: all 0.2s ease;
    }
    .file-item a:hover {
      background-color: #e6f4f1;
      border-color: #7cc4b5;
      transform: translateY(-2px);
    }
    .file-info { display: flex; align-items: center; gap: 12px; }
    .file-name { font-weight: 600; font-size: 15px; }
    .arrow { color: #64748b; font-weight: bold; }
    .status { font-size: 14px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>FreeSpeaking</h1>
    <p class="subtitle">Auto-updated document index</p>
    <div id="content"><p class="status">Loading files...</p></div>
  </div>

  <script>
    const GITHUB_USER = "lehanh2882-liy";
    const GITHUB_REPO = "FreeSpeaking";
    const BRANCH = "main"; // Đổi thành "master" nếu nhánh chính của repo là master

    const IGNORED_FILES = new Set(["index.html", "README.md", ".nojekyll"]);

    async function fetchAllFiles(path = "") {
      const encodedPath = path
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${encodedPath}?ref=${encodeURIComponent(BRANCH)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const items = await res.json();
      let collected = [];

      for (const item of items) {
        if (item.type === "file") {
          if (!path && IGNORED_FILES.has(item.name)) continue;

          const safeWebPath = "./" + item.path
            .split("/")
            .map(encodeURIComponent)
            .join("/");

          collected.push({
            folder: path || "Root",
            name: item.name,
            title: item.name.replace(/\.[^/.]+$/, ""),
            url: safeWebPath
          });
        } else if (item.type === "dir") {
          const subFiles = await fetchAllFiles(item.path);
          collected = collected.concat(subFiles);
        }
      }

      return collected;
    }

    function getIcon(filename) {
      const lower = filename.toLowerCase();
      if (lower.endsWith(".html") || lower.endsWith(".htm")) return "🌐";
      if (lower.endsWith(".pdf")) return "📕";
      if (lower.endsWith(".mp3") || lower.endsWith(".wav") || lower.endsWith(".ogg")) return "🎧";
      if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp")) return "🖼️";
      return "📄";
    }

    async function renderIndex() {
      const container = document.getElementById("content");
      try {
        const files = await fetchAllFiles("");

        files.sort((a, b) => {
          const folderCmp = a.folder.localeCompare(b.folder, undefined, { numeric: true });
          if (folderCmp !== 0) return folderCmp;
          return a.name.localeCompare(b.name, undefined, { numeric: true });
        });

        if (files.length === 0) {
          container.innerHTML = `<p class="status">No documents found yet.</p>`;
          return;
        }

        const grouped = new Map();
        for (const file of files) {
          if (!grouped.has(file.folder)) grouped.set(file.folder, []);
          grouped.get(file.folder).push(file);
        }

        container.innerHTML = "";
        for (const [folderName, folderFiles] of grouped.entries()) {
          const heading = document.createElement("div");
          heading.className = "folder-heading";
          heading.textContent = folderName === "Root" ?
